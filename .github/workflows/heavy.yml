name: Ağır verileri güncelle
on:
  schedule:
    - cron: '20 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-heavy
  cancel-in-progress: false
jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Verileri topla
        run: python3 scripts/fetch_data.py heavy 2>&1 | tee /tmp/log.txt
      - name: Kaydet
        run: |
          git config user.name "veri-botu"
          git config user.email "veri-botu@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "değişiklik yok"; exit 0; fi
          git commit -qm "Veriler güncellendi"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && break; sleep 5; done; exit 0
      - name: Günlüğü kaydet
        if: always()
        run: |
          cd /tmp && rm -rf out && mkdir out && cd out && git init -q && git checkout -q -b ci-logs-heavy
          cp /tmp/log.txt data-log.txt 2>/dev/null || echo "yok" > data-log.txt
          git add . && git -c user.name=ci -c user.email=ci@local commit -qm "log"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs-heavy
